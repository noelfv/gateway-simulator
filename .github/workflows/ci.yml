name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile
        run: mvn clean compile -B
        env:
          MAVEN_OPTS: -Djava.awt.headless=true

      - name: Test
        run: mvn test -B
        env:
          MAVEN_OPTS: -Djava.awt.headless=true

      - name: Package
        run: mvn package -DskipTests -B
        env:
          MAVEN_OPTS: -Djava.awt.headless=true

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/newVersion'
        uses: actions/upload-artifact@v4
        with:
          name: gateway-simulator-${{ github.sha }}
          path: target/dist/
          retention-days: 7
