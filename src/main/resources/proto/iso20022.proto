  google.protobuf.StringValue networkName = 11;
  google.protobuf.StringValue exchangeIdentification = 12;
  google.protobuf.StringValue protocolVersion = 13;
  InitiatingParty initiatingParty = 14;
  RecipientParty recipientParty = 15;
  google.protobuf.StringValue socketPort = 16;
  google.protobuf.BoolValue isSimulation = 17;
  AddendumData addendumData = 18;
  Monitoring monitoring = 19;
  google.protobuf.StringValue socketIp = 20;
  google.protobuf.StringValue socketClusterPort = 21;
  CustomDataLocal customDataLocal = 22;
}

