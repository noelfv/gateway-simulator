syntax = "proto3";
import "google/protobuf/wrappers.proto";

package b.gateway.v1;

option java_package = "com.bbva.business.gateway.iso20022";
option java_multiple_files = true;

service CryptoService {
  rpc Tokenize(Iso20022Request) returns (Iso20022Response);
  rpc Untokenize(Iso20022Request) returns (Iso20022Response);
  rpc ValidateMac(Iso20022Request) returns (Iso20022Response);
}

service FraudService {
  rpc GetFraudInfo (Iso20022Request) returns (Iso20022Response){}
  rpc PostFeedBackFraud (Iso20022Request) returns (Empty) {}
  rpc GetFraudInfoAsync (Iso20022Request) returns (Empty){}
}

service MonitorService {
  rpc PostPatchInsertDocument(Iso20022Request) returns (Empty);
  rpc PostPatchUpdateDocument(Iso20022Request) returns (Empty);
}

service FlowHandlerService {
  rpc SendResolverConnector(Iso20022Request) returns (Iso20022Response);
  rpc SendResolverConnectorAsync (Iso20022Request) returns (Empty);
}

service ApiConnectorService {
  rpc SendAPIConnector(Iso20022Request) returns (Iso20022Response);
}

service DialogControlService {
  rpc Process (Iso20022Request) returns (Iso20022Response);
  rpc SignOn (Iso20022Request) returns (Iso20022Response);
  rpc SignOff (Iso20022Request) returns (Iso20022Response);
  rpc Echo (Iso20022Request) returns (Iso20022Response);
}

service DummyResponseService {
  rpc GetDummyResponse (Iso20022Request) returns (Iso20022Response);
}

service EventService {
  rpc PostEvent (Iso20022Request) returns (Iso20022Response);
}


